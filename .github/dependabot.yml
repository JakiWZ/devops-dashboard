# Aggiornamenti settimanali raggruppati: dipendenze npm dei due package, GitHub Actions e
# immagine base del Dockerfile. Ogni PR passa dalla stessa CI di una modifica manuale.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    # TypeScript resta sulla 5.9 finché ts-jest e typescript-eslint non supportano la versione successiva.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # TypeScript resta sulla 5.9 finché ts-jest e typescript-eslint non supportano la versione successiva.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # Node resta sulla linea LTS (22, come .nvmrc e la CI): il salto di versione maggiore si fa a mano.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
